{% extends "base.html" %}
{% block title %}Inloggen — bodeuro{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="panel auth-card">
    <p class="modal-eyebrow">bodeuro online</p>
    <h2>Inloggen</h2>
    <p class="auth-sub">Jouw saldo, jouw kaart, jouw bodeuro. Alleen met jouw naam en secrete code.</p>
    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <label class="field">
        <span>Naam</span>
        <input type="text" name="naam" required autofocus maxlength="40"
               placeholder="bijv. Demo" value="{{ request.form.naam or '' }}">
      </label>
      <label class="field">
        <span>Secrete code</span>
        <input type="password" name="code" required maxlength="64" placeholder="••••">
      </label>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Inloggen</button>
    </form>
    <p class="auth-alt">Nog geen rekening? <a class="link" href="{{ url_for('account') }}">Open er een →</a></p>
    <div class="demo-hint">
      🧪 Proefrekening: naam <b>Demo</b> · code <b>bodeuro</b>
    </div>
  </div>
</section>
{% endblock %}
